name: iOS 16 compiler checks
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.component }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [swift, native]
    steps:
      - name: Check out port patch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: port
          persist-credentials: false
      - name: Check out matching upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: intraducine/iridium
          ref: c5e759da30fd2547786ba7ea68657c611f6562c5
          path: upstream
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify source and apply iOS 16 patch
        working-directory: upstream
        run: |
          test "$(git rev-parse HEAD)" = c5e759da30fd2547786ba7ea68657c611f6562c5
          git apply --check --whitespace=error-all ../port/patches/ios16-checkpoint.patch
          git apply ../port/patches/ios16-checkpoint.patch
          git diff --check
          mkdir -p .build/ios16-diagnostics .build/ios16-native-diagnostics
          git rev-parse HEAD > .build/ios16-diagnostics/source.log
          git -C ../port rev-parse HEAD >> .build/ios16-diagnostics/source.log
          shasum -a 256 ../port/patches/ios16-checkpoint.patch >> .build/ios16-diagnostics/source.log
          cp .build/ios16-diagnostics/source.log .build/ios16-native-diagnostics/source.log
      - name: Check repository standards
        working-directory: upstream
        run: python3 ci/check-standards.py
      - name: Install project generator
        if: matrix.component == 'swift'
        run: brew install xcodegen
      - name: Compile Swift and adapters
        if: matrix.component == 'swift'
        working-directory: upstream
        run: bash ci/check-ios16-compile.sh
      - name: Ensure Metal compiler is available
        if: matrix.component == 'native'
        working-directory: upstream
        run: |
          if ! xcrun --sdk iphoneos metal --version > .build/ios16-native-diagnostics/metal-toolchain.log 2>&1; then
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee -a .build/ios16-native-diagnostics/metal-toolchain.log
          fi
      - name: Compile native sources and Metal 3.0 helpers
        if: matrix.component == 'native'
        working-directory: upstream
        run: bash ci/check-ios16-native.sh
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Iridium-iOS16-${{ matrix.component }}-diagnostics
          path: |
            upstream/.build/ios16-diagnostics/*.log
            upstream/.build/ios16-diagnostics/*.xcresult
            upstream/.build/ios16-native-diagnostics/*.log
            upstream/.build/ios16-native-diagnostics/*.tsv
          if-no-files-found: warn
          retention-days: 7
